name: Build and publish Docker images

on:
  push:
    branches:
      - fix/bd-voting-and-ui-copy
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component: >-
          ${{ fromJSON(
            (startsWith(github.event.head_commit.message || '', 'release(api):') && '["api"]') ||
            (startsWith(github.event.head_commit.message || '', 'release(app):') && '["app"]') ||
            '["app","api"]'
          ) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./app/hackhub-${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hackhub:${{ matrix.component }}-${{ github.sha }}

      - name: Package published frontend for offline deployment
        if: matrix.component == 'app'
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/hackhub
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: bash offline-release/package-frontend.sh

      - name: Upload frontend deployment package
        if: matrix.component == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: website-frontend-${{ github.sha }}
          path: dist-offline/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: Package published images for offline deployment
    if: ${{ !startsWith(github.event.head_commit.message || '', 'release(app):') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify published images and package the release
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/hackhub
          RELEASE_SCOPE: ${{ startsWith(github.event.head_commit.message || '', 'release(api):') && 'api' || 'app-api' }}
        run: bash offline-release/package-app-api.sh "$RELEASE_SCOPE"

      - name: Upload offline deployment package
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ startsWith(github.event.head_commit.message || '', 'release(api):') && 'api' || 'app-api' }}-${{ github.sha }}
          path: dist-offline/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
